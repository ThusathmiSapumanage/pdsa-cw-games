spring.application.name=games
spring.profiles.active=local

spring.config.import=optional:file:.env[.properties],optional:file:games-backend/.env[.properties],optional:file:../games-backend/.env[.properties]

spring.datasource.url=jdbc:mysql://localhost:3306/algocore_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

cors.allowed-origins=http://localhost:3000