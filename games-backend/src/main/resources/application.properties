spring.application.name=games
spring.profiles.active=local

spring.datasource.url=jdbc:mysql://localhost:3306/algocore_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

jwt.secret=change-this-secret-key-to-a-secure-32-byte-minimum-value
jwt.expiration-ms=86400000

cors.allowed-origins=http://localhost:3000